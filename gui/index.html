<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
            http-equiv="Content-Security-Policy"
            content="default-src 'self'; script-src 'self'; style-src 'self'"
    >
    <meta
            name="viewport"
            content="width=device-width, initial-scale=1"
    >

    <title>DevDoctor</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
<main class="app">
    <header class="header">
        <div>
            <p class="eyebrow">System diagnostics</p>
            <h1>DevDoctor</h1>
            <p class="subtitle">
                Check commands, directories, and ports from one place.
            </p>
        </div>

        <button id="run-button" type="button">
            Run diagnostics
        </button>
    </header>

    <section class="summary">
        <article>
            <span>Total</span>
            <strong id="total-count">—</strong>
        </article>

        <article class="passed">
            <span>Passed</span>
            <strong id="passed-count">—</strong>
        </article>

        <article class="failed">
            <span>Failed</span>
            <strong id="failed-count">—</strong>
        </article>
    </section>

    <section class="checks">
        <div class="checks-heading">
            <h2>Diagnostic checks</h2>
            <span id="run-status">Ready</span>
        </div>

        <div id="empty-state" class="empty-state">
            <p id="result-message">
                Ready to inspect this machine.
            </p>

            <small id="result-detail">
                Diagnostic results will appear here.
            </small>
        </div>

        <div id="checks-list" class="check-list" hidden></div>
    </section>
</main>
<script src="renderer.js"></script>

</body>
</html>
