<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
            http-equiv="Content-Security-Policy"
            content="default-src 'self'; style-src 'self'"
    >
    <meta
            name="viewport"
            content="width=device-width, initial-scale=1"
    >

    <title>DevDoctor</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
<main class="app">
    <header class="header">
        <div>
            <p class="eyebrow">System diagnostics</p>
            <h1>DevDoctor</h1>
            <p class="subtitle">
                Check commands, directories, and ports from one place.
            </p>
        </div>

        <button type="button" disabled>
            Run diagnostics
        </button>
    </header>

    <section class="summary">
        <article>
            <span>Total</span>
            <strong>—</strong>
        </article>

        <article class="passed">
            <span>Passed</span>
            <strong>—</strong>
        </article>

        <article class="failed">
            <span>Failed</span>
            <strong>—</strong>
        </article>
    </section>

    <section class="checks">
        <div class="checks-heading">
            <h2>Diagnostic checks</h2>
            <span>Waiting</span>
        </div>

        <div class="empty-state">
            <p>DevDoctor’s CLI connection comes next.</p>
            <small>
                Soon this space will contain real diagnostic results.
            </small>
        </div>
    </section>
</main>
</body>
</html>
